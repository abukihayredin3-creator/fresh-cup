name: Fresh Cup CI

on:
  push:
    branches: [main]
    paths:
      - "fresh-cup-platform/**"
      - ".github/workflows/fresh-cup-ci.yml"
  pull_request:
    paths:
      - "fresh-cup-platform/**"
      - ".github/workflows/fresh-cup-ci.yml"

defaults:
  run:
    working-directory: fresh-cup-platform

concurrency:
  group: fresh-cup-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.0"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: fresh-cup-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fresh-cup/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: fresh-cup-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fresh-cup/api prisma:generate

      - name: Build all apps and packages
        run: pnpm build
        env:
          # Placeholder values so build-time env validation passes in CI —
          # no real infrastructure is contacted during a build.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          REDIS_URL: "redis://localhost:6379"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fresh_cup
          POSTGRES_PASSWORD: fresh_cup
          POSTGRES_DB: fresh_cup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fresh_cup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: fresh-cup-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fresh-cup/api prisma:generate

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://fresh_cup:fresh_cup@localhost:5432/fresh_cup_test"
          REDIS_URL: "redis://localhost:6379"
