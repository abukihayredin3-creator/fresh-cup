apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresh-cup-api-green
  namespace: fresh-cup
  labels:
    app: fresh-cup-api
    slot: green
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fresh-cup-api
      slot: green
  template:
    metadata:
      labels:
        app: fresh-cup-api
        slot: green
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "4000"
    spec:
      containers:
        - name: api
          image: ghcr.io/fresh-cup/fresh-cup-api:latest
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: fresh-cup-api-config
            - secretRef:
                name: fresh-cup-api-secrets
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
