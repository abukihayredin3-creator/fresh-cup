apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresh-cup-api-canary
  namespace: fresh-cup
  labels:
    app: fresh-cup-api
    track: canary
spec:
  # Deliberately small and fixed — the canary's SHARE of traffic is
  # controlled by the Ingress's canary-weight annotation
  # (ingress-canary.yaml), not by this replica count, so it doesn't need
  # to scale with the stable track.
  replicas: 1
  selector:
    matchLabels:
      app: fresh-cup-api
      track: canary
  template:
    metadata:
      labels:
        app: fresh-cup-api
        track: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "4000"
    spec:
      containers:
        - name: api
          image: ghcr.io/fresh-cup/fresh-cup-api:canary
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: fresh-cup-api-config
            - secretRef:
                name: fresh-cup-api-secrets
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fresh-cup-api-canary
  namespace: fresh-cup
spec:
  selector:
    app: fresh-cup-api
    track: canary
  ports:
    - name: http
      port: 80
      targetPort: http
