apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fresh-cup-api
  namespace: fresh-cup
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fresh-cup-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Order traffic is bursty (lunch/dinner rushes) — a 5-minute
      # stabilization window avoids flapping replicas down right after
      # a burst subsides, only to scale back up minutes later.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
