apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fresh-cup-api
  namespace: fresh-cup
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.freshcup.example.com
      secretName: fresh-cup-api-tls
  rules:
    - host: api.freshcup.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fresh-cup-api
                port:
                  name: http
