apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresh-cup-api
  namespace: fresh-cup
  labels:
    app: fresh-cup-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fresh-cup-api
  template:
    metadata:
      labels:
        app: fresh-cup-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "4000"
    spec:
      containers:
        - name: api
          image: ghcr.io/fresh-cup/fresh-cup-api:latest
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: fresh-cup-api-config
            - secretRef:
                name: fresh-cup-api-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          # /health never touches Postgres/Redis — a dependency outage
          # shouldn't cause a liveness-triggered restart loop, only fail
          # readiness (see src/modules/health/health.controller.ts).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
      terminationGracePeriodSeconds: 30
