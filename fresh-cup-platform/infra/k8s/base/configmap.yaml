apiVersion: v1
kind: ConfigMap
metadata:
  name: fresh-cup-api-config
  namespace: fresh-cup
data:
  NODE_ENV: "production"
  PORT: "4000"
  JWT_ACCESS_TTL: "900"
  REFRESH_TOKEN_TTL_DAYS: "30"
  OTP_TTL_MINUTES: "5"
  OTP_MAX_ATTEMPTS: "5"
  LOYALTY_MINOR_UNITS_PER_POINT: "100"
  TAX_RATE_PERCENT: "15"
  DELIVERY_FLAT_FEE: "5000"
  LLM_PROVIDER: "anthropic"
  EMBEDDING_PROVIDER: "local"
  VECTOR_PROVIDER: "pgvector"
  ENTERPRISE_SSO_SAML_ALLOW_UNVERIFIED: "false"
  ENTERPRISE_WEBAUTHN_RP_ID: "app.freshcup.example.com"
  ENTERPRISE_WEBAUTHN_ORIGIN: "https://app.freshcup.example.com"
  WEB_APP_URL: "https://freshcup.example.com"
  ADMIN_APP_URL: "https://admin.freshcup.example.com"
  DELIVERY_APP_URL: "https://delivery.freshcup.example.com"
