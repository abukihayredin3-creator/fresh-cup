# Template only — never commit real values. Populate through your
# cluster's secret manager (Sealed Secrets, External Secrets Operator,
# SOPS, cloud KMS-backed secret store, etc.) and apply the resulting
# Secret instead of this file.
apiVersion: v1
kind: Secret
metadata:
  name: fresh-cup-api-secrets
  namespace: fresh-cup
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/fresh_cup_prod"
  REDIS_URL: "redis://HOST:6379"
  JWT_ACCESS_SECRET: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
  CHAPA_SECRET_KEY: "REPLACE_ME"
  CHAPA_WEBHOOK_SECRET: "REPLACE_ME"
