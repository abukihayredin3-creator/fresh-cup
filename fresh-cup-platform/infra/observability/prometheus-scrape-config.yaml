# Scrape config for a self-managed Prometheus (kube-prometheus-stack or
# similar). Relies on the `prometheus.io/scrape` pod annotations already
# set on fresh-cup-api's Deployments (infra/k8s/base/api-deployment.yaml
# and friends) — kubernetes_sd_configs + relabeling picks those up
# automatically rather than hardcoding pod IPs.
scrape_configs:
  - job_name: fresh-cup-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["fresh-cup"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: "([^:]+)(?::\\d+)?;(\\d+)"
        replacement: "$1:$2"
      - source_labels: [__meta_kubernetes_pod_label_slot]
        target_label: slot
      - source_labels: [__meta_kubernetes_pod_label_track]
        target_label: track
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
