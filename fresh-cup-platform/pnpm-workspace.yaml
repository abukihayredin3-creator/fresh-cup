packages:
  - "apps/*"
  - "packages/*"

# Explicit allowlist for workspace dependencies that run install-time build
# scripts, so `pnpm install` is non-interactive and reproducible in CI/Docker
# instead of prompting via `pnpm approve-builds`.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - prisma
  - sharp
  - unrs-resolver
